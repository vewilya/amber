[project]
name = "torchline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
authors = [
    { name = "vewilya", email = "77921468+vewilya@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.11.2",
